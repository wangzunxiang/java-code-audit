rules:
  - id: java-jdbc-string-concat-sqli
    languages: [java]
    severity: ERROR
    message: SQL 语句使用字符串拼接用户输入，存在 SQL 注入风险（CWE-89）。应改用 PreparedStatement。
    metadata:
      cwe: ["CWE-89"]
      owasp: ["A03:2021-Injection"]
      confidence: MEDIUM
    patterns:
      - pattern: |
          $ST.executeQuery("..." + $X + "...")
      - pattern-either:
          - pattern: |
              $ST.executeUpdate("..." + $X + "...")
          - pattern: |
              $ST.execute("..." + $X + "...")
